<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Studious | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="images/favicon.png"><!--Adjust for Spring reference-->
  <link rel="stylesheet" href="login.css"><!--Adjust for Spring reference-->
</head>

<body>

<main class="layout">

  <!-- Left image -->
  <section class="layout__left">
    <img class="layout__image" src="images/4.jpg" alt="Students studying"><!--Adjust for Spring reference-->
  </section>

  <!-- Right -->
  <section class="layout__right">

    <header>
      <img src="images/2.png" alt="Studious logo">
      <p style="font-size:16px; letter-spacing: 4px;">A Student’s Best Friend</p>
    </header>

    <!-- Slider toggle -->
    <nav class="auth-toggle">
      <span class="auth-toggle__slider"></span>
      <button class="auth-toggle__btn is-active" data-mode="login">Login</button>
      <button class="auth-toggle__btn" data-mode="signup">Sign Up</button>
    </nav>

    <!-- Forms container -->
    <section class="auth-forms">

      <!-- LOGIN -->
      <form id="loginForm" method="post" action="/login" class="auth-form auth-form--login is-active">
        <legend>Login Credentials</legend>
        <div class="field">
          <input
            id="emailInput"
            type="email"
            name="email"
            placeholder="Email"
            required
          >
        </div>

        <div class="field">
          <input
            id="passwordInput"
            type="password"
            name="password"
            placeholder="Password"
            required
          >
        </div>

        <div class="auth-actions auth-actions--single">
          <button type="submit" class="btn btn--primary">Login</button>
        </div>

        <p class="auth-link">
          <a href="#">Forgot my password</a>
        </p>
      </form>

      <!-- SIGN UP -->
      <form id="signUpForm" class="auth-form auth-form--signup" method="post" action="/register">

        <fieldset class="two-col">
          <legend>Personal information</legend>

          <div class="field">
            <input
              type="text"
              name="firstName"
              placeholder="First name"
              required
            >
          </div>

          <div class="field">
            <input
              type="text"
              name="lastName"
              placeholder="Last name"
              required
            >
          </div>
        </fieldset>

        <fieldset>
          <legend>Account details</legend>

          <div class="field">
            <input
              type="email"
              name="email"
              placeholder="Email"
              required
            >
          </div>

          <div class="field">
            <input
              type="password"
              name="password"
              placeholder="Password"
              required
            >
          </div>

          <div class="field">
            <input
              type="password"
              name="confirmPassword"
              placeholder="Re-enter password"
              required
            >
          </div>
        </fieldset>

        <fieldset>
          <legend>Academic information</legend>

          <div class="field">
            <input
              type="text"
              name="school"
              placeholder="School / University"
              required
            >
          </div>

          <div class="field">
            <input
              type="text"
              name="course"
              placeholder="Course of study"
              required
            >
          </div>
        </fieldset>

        <div class="auth-actions">
          <button class="btn btn--ghost" type="reset">Clear</button>
          <button class="btn btn--primary" type="submit">Register</button>
        </div>

      </form>

    </section>
    <footer>
      <small>© 2026 Copyright Studious</small>
    </footer>  

  </section>
</main>

<script src="login.js"></script><!--Adjust for Spring reference-->
</body>
</html>
