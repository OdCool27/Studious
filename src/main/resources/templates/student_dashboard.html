<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studious | Dashboard </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link rel="icon" href="/images/favicon.png"><!--Adjust for Spring reference-->
    <link rel="stylesheet" href="/css/student_dashboard.css"><!--Adjust for Spring reference-->
</head>
<body>
    <div class="overlay inactive">
        <div class="profile-window">
            <div class="exit-methods">
                <form th:action="@{/logout}" method="post">
                    <button class="logout-btn" type="submit">Logout</button>
                </form>

                <button class="close-window">X</button>
            </div>
            <h2>My Profile</h2>
            <p>Edit the details below</p>

            <div class="edit-profile">
                <div class="profile-image">
                    <div class="profile-image-overlay">
                        <img src="/images/default-profile-icon.png" alt="profile_image"><!--Adjust for Spring reference-->
                    </div>
                </div>
                <div class="profile-details">
                    <form class="edit-profile-form">
                        <table>
                            <tr>
                                <th><label for="firstName">First Name</label></th>
                                <td><input type="text" id="firstName" th:value="${student.firstName}"></td>
                            </tr>
                            <tr>
                                <th><label for="lastName">Last Name</label></th>
                                <td><input type="text" id="lastName" th:value="${student.lastName}"></td>
                            </tr>
                            <tr>
                                <th><label for="email">Email</label></th>
                                <td><input type="email" id="email" th:value="${student.email}"></td>
                            </tr>
                            <tr>
                                <th><label for="school">School</label></th>
                                <td><input type="text" id="school" th:value="${student.school}"></td>
                            </tr>
                            <tr>
                                <th><label for="course">Course</label></th>
                                <td><input type="text" id="course" th:value="${student.course}"></td>
                            </tr>
                        </table>
                        <input class="update-btn" type="submit" value="Update Profile">
                    </form>
                </div>
            </div>

        </div>

    </div>


    <nav>
        <div class="slider-container">
            <div class="icon active">
                <img src="/images/calendar-icon.png" alt="student calendar"><!--Adjust for Spring reference-->
            </div>
            <div class="icon">
                <img src="/images/tasks-icon.png" alt="academic tasks"><!--Adjust for Spring reference-->
            </div>
            <div class="icon">
                <img src="/images/groups-icon.png" alt="student groups"><!--Adjust for Spring reference-->
            </div>
        </div>
    </nav>

    <div class="main-view">

        <div class="container">
            <div class="header">
                <div class="logo">
                    <img src="/images/2.png" alt="logo"><!--Adjust for Spring reference-->
                </div>
                <div class="profile-info">
                    <div class="profile">
                        <img src="/images/default-profile-icon.png" alt="profile"><!--Adjust for Spring reference-->
                    </div>
                    <p class="welcome">Welcome, <span th:text="${student.firstName} ${student.lastName}">Student</span>!</p>
                </div>

            </div>

            <div class="timetable-view view selected">
                <h1>Timetable</h1>
                <div class="button-container">
                    <button class="manage-modules">Manage Modules</button>
                    <button class="add-session">+ Add Session</button>
                    <button class="remove-session">- Remove Session</button>
                    <button class="edit-session">Edit Session</button>
                </div>
                <div class="table-wrapper">
                    <table id="timetable">
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Monday</th>
                                <th>Tuesday</th>
                                <th>Wednesday</th>
                                <th>Thursday</th>
                                <th>Friday</th>
                                <th>Saturday</th>
                                <th>Sunday</th>
                            </tr>
                        </thead>
                        <tbody>

                        </tbody>
                    </table>
                </div>
            </div>


            <div class="task-view view">
                <h1>Academic Tasks</h1>

                <div class="button-container">
                    <button class="add-task">+ Add Task</button>
                    <button class="remove-task">- Remove Task</button>
                    <button class="clear-task">Clear Table</button>
                </div>
                <p>Pending: 0 | Ongoing: 0 | Complete: 0</p>

                <div class="table-wrapper">
                    <table class="task-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Module</th>
                                <th>Description</th>
                                <th>Due Date</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>

                        </tbody>
                    </table>
                </div>
            </div>
            <div class="group-view view">

            </div>




        </div>

    </div>

    <script src="/js/student_dashboard.js"></script><!--Adjust for Spring reference-->
    <script src="/js/timetable.js"></script><!--Adjust for Spring reference-->
</body>
</html>
