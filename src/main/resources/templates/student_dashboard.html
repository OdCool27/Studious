<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Studious | Assignments</title>
    <link rel="icon" href="../static/images/favicon.png">
    <link rel="stylesheet" href="../static/css/student_dashboard.css">
</head>
<body>
    <nav>
        <div class="slider-container">
            <div class="icon active">
                <img src="../static/images/tasks-icon.png" alt="academic tasks">
            </div>
            <div class="icon">
                <img src="../static/images/calendar-icon.png" alt="student calendar">
            </div>
            <div class="icon">
                <img src="../static/images/groups-icon.png" alt="student groups">
            </div>
        </div>
    </nav>

    <div class="main-view">
        <div class="header">
            <div class="logo">
                <img src="../static/images/2.png" alt="logo">
            </div>
            <div class="profile">
                <img src="../static/images/default-profile-icon.png" alt="profile">
            </div>
        </div>
        <div class="container">

            <div class="task-view">
                <h1>Academic Tasks</h1>
                <p>Welcome, {FName}</p>
                <div class="button-container">
                    <button class="add-task">+ Add Task</button>
                    <button class="remove-task">- Remove Task</button>
                    <button class="clear-task">Clear Table</button>
                </div>
                <p>Pending: 0 | Ongoing: 0 | Complete: 0</p>

                <table class="task-table">
                    <tr>
                        <th>Name</th>
                        <th>Module</th>
                        <th>Description</th>
                        <th>Due Date</th>
                        <th>Status</th>
                    </tr>
                    <tr>

                    </tr>
                </table>
            </div>

        </div>

    </div>

    <script src="../static/js/student_dashboard.js"></script>
</body>
</html>
